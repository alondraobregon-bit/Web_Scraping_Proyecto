name: Daily Marketplace Scraper

on:
  schedule:
    - cron: '0 11 * * *'
  
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python and project dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Run Falabella Spider
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          uv run scrapy crawl falabella

      - name: Run Ripley Spider
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          uv run scrapy crawl ripley

